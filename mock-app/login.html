<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Penguin Picks Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Sign in to Penguin Picks</h1>
      <p class="lede">A small shop for people who believe every desk, tote, sofa, and flight needs more penguin energy.</p>
      <form data-login-form>
        <label>Email <input name="email" type="email" /></label>
        <label>Password <input name="password" type="password" /></label>
        <button type="submit">Sign in</button>
      </form>
      <p role="alert"></p>
    </main>
    <span data-testid="app-ready"></span>
    <script src="/app.js"></script>
  </body>
</html>
